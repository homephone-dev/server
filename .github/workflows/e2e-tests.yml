name: e2e-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-e2e-token
      ARI_PASSWORD: ci-e2e-ari-password
      POSTGRES_PASSWORD: ci-e2e-postgres-password
      COMPOSE_PROJECT_NAME: homephone-dev-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Bring up stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Run e2e tests
        run: go test -tags e2e ./test/e2e/...
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
