name: deploy

on:
  push:
    branches: [main]

env:
  REGION: us-central1
  GAR_REPO: homephone
  IMAGE: backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Resolve image path
        id: meta
        run: |
          echo "image=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - name: Write SSH key
        run: |
          install -m 600 /dev/null ~/.ssh/gce_key
          printf '%s' "${{ secrets.GCE_SSH_KEY }}" > ~/.ssh/gce_key

      - name: Copy compose override
        run: |
          scp -i ~/.ssh/gce_key \
            -o StrictHostKeyChecking=no \
            docker-compose.prod.yml \
            "${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }}:~/homephone/docker-compose.prod.yml"

      - name: Rolling restart backend
        run: |
          ssh -i ~/.ssh/gce_key \
            -o StrictHostKeyChecking=no \
            "${{ secrets.GCE_USER }}@${{ secrets.GCE_HOST }}" \
            "cd ~/homephone && \
             BACKEND_IMAGE='${BACKEND_IMAGE}' \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml \
               pull backend && \
             BACKEND_IMAGE='${BACKEND_IMAGE}' \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml \
               up -d --no-deps backend && \
             docker image prune -f"
