[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- device-1: the home phone ---
;
; e2e-test simplification (see docs/testing.md): rather than fight SIPp's
; digest-auth scripting, this endpoint is identified by source
; host/IP via a `type=identify` object instead of a SIP digest challenge.
; This only weakens SIP-level auth for this named test endpoint on the
; docker-compose network — it has no bearing on the backend's allow/block
; decision logic (internal/decision, internal/callctl), which never trusts
; anything from the SIP layer beyond "which endpoint/number is this" and is
; unchanged. Real deployments should keep auth=; this endpoint's password
; was already a dev-only placeholder pre-e2e.
[device-1]
type=endpoint
context=stasis-in
disallow=all
allow=ulaw
aors=device-1-aor
identify_by=username,ip
; Keep media flowing through Asterisk instead of letting the two bridged
; legs renegotiate direct RTP between themselves right after answer -- the
; backend's call logging/control model assumes Asterisk stays in the media
; path for the life of the call, and direct_media's post-bridge re-INVITE
; was breaking the e2e SIPp UAC scenario (which doesn't expect a second
; in-dialog INVITE).
direct_media=no

[device-1-identify]
type=identify
endpoint=device-1
match=sip-device

; Static contact: the e2e SIPp UAS container is a long-lived test fixture,
; not a real dynamic phone, so it doesn't need to REGISTER — Asterisk can
; just always know where to send calls for this endpoint.
[device-1-aor]
type=aor
contact=sip:device-1@sip-device:5061
qualify_frequency=0

; --- trunk-mock: e2e-only stand-in for an outside PSTN trunk ---
[trunk-mock]
type=endpoint
context=stasis-in
disallow=all
allow=ulaw
aors=trunk-mock-aor
identify_by=username,ip
direct_media=no

[trunk-mock-identify]
type=identify
endpoint=trunk-mock
match=sip-trunk-mock

[trunk-mock-aor]
type=aor
contact=sip:trunk-mock@sip-trunk-mock:5061
qualify_frequency=0
