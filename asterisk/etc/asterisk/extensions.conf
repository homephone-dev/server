[stasis-in]
; Both inbound and outbound calls enter this single dialplan line and go
; straight into the one Stasis app. Direction and target are derived by the
; Go backend from StasisStart's channel endpoint + args, not from any logic
; here.
; Explicit "h" (hangup) extension: Asterisk executes this when a channel
; already hung up (e.g. the Stasis app itself ends the channel) resumes
; dialplan execution. Exact-literal extensions always take precedence over
; pattern matches, so this keeps the catch-all pattern below from re-
; entering Stasis() with a bogus "h" arg on every hangup.
exten => h,1,Hangup()

exten => _.,1,NoOp(Entering Stasis for ${CHANNEL(endpoint)})
 same => n,Stasis(homephone,${CHANNEL(endpoint)},${EXTEN})
 same => n,Hangup()
